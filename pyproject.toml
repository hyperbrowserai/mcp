[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperbrowser-mcp"
version = "0.2.0"
description = "Hyperbrowser Model Context Protocol server implemented in Python with SSE transport."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Hyperbrowser", email = "support@hyperbrowser.ai" }]
license = { text = "MIT" }
dependencies = [
  "hyperbrowser>=0.73.0",
  "httpx>=0.28.1",
  "mcp>=1.21.1",
  "pydantic-settings>=2.6.0",
  "structlog>=24.3.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "coverage[toml]>=7.6.10",
  "ruff>=0.9.5",
  "mypy>=1.13.0",
  "types-requests>=2.32.0.20241016",
]

[project.scripts]
hyperbrowser-mcp = "hyperbrowser_mcp.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "N"]
lint.ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["hyperbrowser_mcp"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
packages = ["hyperbrowser_mcp"]
strict = false
python_version = "3.12"

